[project]
name = "projectcompass"
version = "2.7.0"
description = "Analysis catalog and execution platform"
requires-python = ">=3.10"
dependencies = [
    "flask==3.0.0",
    "flask-cors==4.0.0",
    "flask-wtf==1.2.1",
    "gitpython==3.1.40",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyyaml==6.0.1",
    "gunicorn==21.2.0",
    "pyjwt==2.8.0",
    "duckdb>=0.9.0",
    "python-dotenv==1.0.1",
    "werkzeug>=3.0.0",
    "scomp-link>=2.2.0",
    "flask-apscheduler>=1.13.1",
    "flask-sqlalchemy>=3.1.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "connectorx>=0.4.6",
    "cryptography>=50.0.2",
    "pyarrow>=24.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B"]
ignore = ["S101", "S104", "S105", "S108", "S110", "S603", "S605", "S607", "S608"]

[tool.ruff.lint.per-file-ignores]
"utils/analysis_utils.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not k0s'"
markers = [
    "k0s: live k0s Kubernetes cluster verification tests (requires K0S_LIVE_TEST=1)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]

# ProjectCompass - Docker Compose for end users
# Usage: docker compose up -d
# Docs:  https://github.com/GiacomoSaccaggi/ProjectCompass

services:
  projectcompass:
    image: ghcr.io/giacomosaccaggi/projectcompass:latest
    ports:
      - "8080:8080"
    environment:
      - SECRET_KEY=change-me-to-a-random-string
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD_HASH=
      - PORT=8080
      - MITHRIL_HOST=http://mithril:16180
      - ALLOWED_ORIGINS=*
    volumes:
      - ./data/Analyses:/app/Analyses
      - ./data/Saved_data:/app/Saved_data
      - ./data/Saved_queries:/app/Saved_queries
    restart: unless-stopped
    depends_on:
      - mithril
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mithril:
    image: ghcr.io/giacomosaccaggi/mithril:latest
    ports:
      - "16180:16180"
    environment:
      - MITHRIL_KEY_GEMINI=${MITHRIL_KEY_GEMINI:-}
      - MITHRIL_KEY_OPENAI=${MITHRIL_KEY_OPENAI:-}
      - MITHRIL_KEY_ANTHROPIC=${MITHRIL_KEY_ANTHROPIC:-}
      - MITHRIL_KEY_GROQ=${MITHRIL_KEY_GROQ:-}
    volumes:
      - ./.mithril:/root/.mithril
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:16180/health"]
      interval: 30s
      timeout: 5s
      retries: 3

apiVersion: v1
kind: ServiceAccount
metadata:
  name: projectcompass-console
  namespace: default
  labels:
    app.kubernetes.io/name: projectcompass
---
# Cluster-level read-only access to observe worker Nodes and optional metrics
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: projectcompass-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: projectcompass-node-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: projectcompass-node-reader
subjects:
  - kind: ServiceAccount
    name: projectcompass-console
    namespace: default
---
# Namespace-scoped permissions to launch isolated Flow Jobs, ConfigMaps, Secrets, and read Pod logs
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: projectcompass-flow-runner
  namespace: default
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: projectcompass-flow-runner-binding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: projectcompass-flow-runner
subjects:
  - kind: ServiceAccount
    name: projectcompass-console
    namespace: default

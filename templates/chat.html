<!DOCTYPE html>
<html>
<head>
    <title>Chat - {{ pc.branding.app_name }}</title>
    {{ head | safe }}
    <style>
        .chat-container { max-width: 900px; margin: 16px auto 24px; padding: 24px; background: var(--mariner-bg-card, #fffdf8); border: 1px solid var(--mariner-border-subtle); border-top: 3px solid var(--mariner-cyan, #0284c7); border-radius: 16px; box-shadow: var(--mariner-shadow-card); }
        .chat-messages { height: 420px; overflow-y: auto; border: 1px solid var(--mariner-border-subtle, #ddd); border-radius: 12px; padding: 16px; margin-bottom: 16px; background: var(--mariner-bg-primary, #fbf9f4); }
        .msg { margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; max-width: 82%; line-height: 1.5; }
        .msg-user { background: linear-gradient(135deg, var(--mariner-cyan, #0284c7) 0%, #0369a1 100%); color: #ffffff; margin-left: auto; text-align: right; border-bottom-right-radius: 3px; }
        .msg-bot { background: var(--mariner-bg-secondary, #f2ede2); color: var(--mariner-text-primary, #0f172a); border: 1px solid var(--mariner-border-subtle); border-bottom-left-radius: 3px; }
        .msg-expr { font-family: 'JetBrains Mono', monospace; font-size: 0.82em; color: var(--mariner-gold, #b45309); margin-top: 6px; }
        .chat-input { display: flex; gap: 10px; }
        .chat-input input { flex: 1; padding: 11px 14px; border: 1px solid var(--mariner-border-strong, rgba(2,132,199,0.38)); border-radius: 10px; }
        .chat-input button { padding: 11px 24px; background: linear-gradient(135deg, var(--mariner-cyan, #0284c7) 0%, var(--mariner-teal, #0d9488) 100%); color: white; border: 1px solid rgba(251, 191, 36, 0.45); border-radius: 10px; font-weight: 600; cursor: pointer; }
        .chat-input button:hover { background: linear-gradient(135deg, #0369a1 0%, var(--mariner-navy, #0b1629) 100%); color: #fbbf24; }
        .chat-input button:disabled { background: #94a3b8; cursor: not-allowed; }
        select { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--mariner-border-strong); margin-bottom: 10px; }
        .controls { display: flex; gap: 15px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
        .controls label { font-size: 0.9em; font-weight: 600; color: var(--mariner-text-secondary, #334155); }
        .status-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72em; font-weight: 700; vertical-align: middle; }
        .status-ok { background: rgba(13, 148, 136, 0.16); color: #0d9488; border: 1px solid rgba(13, 148, 136, 0.35); }
        .status-err { background: rgba(220, 38, 38, 0.14); color: #dc2626; border: 1px solid rgba(220, 38, 38, 0.35); }
        body.dark-mode .chat-container { background: rgba(14, 25, 47, 0.88); }
        body.dark-mode .chat-messages { background: #060d1a; border-color: rgba(56, 189, 248, 0.25); }
        body.dark-mode .msg-bot { background: #0b1629; color: #f1f5f9; border-color: rgba(56, 189, 248, 0.22); }
    </style>
</head>
<body>
{{ top_container | safe }}
{{ sidebar_menu | safe }}
<div class="w3-main" style="margin-left:260px;margin-top:54px;padding:8px 24px;">
    <div class="chat-container">
        <h2>🤖 Data Chat Assistant <span id="statusBadge" class="status-badge"></span></h2>
        <p style="color:#666">Ask questions about your datasets in natural language. The AI will generate and execute pandas queries safely.</p>
        <div class="controls">
            <div>
                <label for="dataset">Dataset: </label>
                <select id="dataset">
                    {% for ds in datasets %}
                    <option value="{{ ds }}">{{ ds }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="model">Model: </label>
                <select id="model">
                    <option value="">Loading...</option>
                </select>
            </div>
        </div>
        <div class="chat-messages" id="messages"></div>
        <div class="chat-input">
            <input type="text" id="question" placeholder="Ask about your data..." onkeypress="if(event.key==='Enter')sendMsg()">
            <button onclick="sendMsg()" id="sendBtn">Send</button>
        </div>
    </div>
</div>
<script>
// Load available models on page init
(function loadModels() {
    fetch('/chat/models')
        .then(r => r.json())
        .then(data => {
            const sel = document.getElementById('model');
            sel.innerHTML = '';
            if (data.models && data.models.length > 0) {
                data.models.forEach(m => {
                    sel.innerHTML += `<option value="${m}">${m}</option>`;
                });
                document.getElementById('statusBadge').innerHTML = 'Mithril ✓';
                document.getElementById('statusBadge').className = 'status-badge status-ok';
            } else {
                sel.innerHTML = '<option value="">No models available</option>';
                document.getElementById('statusBadge').innerHTML = 'Mithril ✗';
                document.getElementById('statusBadge').className = 'status-badge status-err';
            }
        })
        .catch(() => {
            document.getElementById('model').innerHTML = '<option value="">Mithril unavailable</option>';
            document.getElementById('statusBadge').innerHTML = 'Mithril ✗';
            document.getElementById('statusBadge').className = 'status-badge status-err';
        });
})();

function sendMsg() {
    const q = document.getElementById('question');
    const ds = document.getElementById('dataset').value;
    const model = document.getElementById('model').value;
    const msgs = document.getElementById('messages');
    const btn = document.getElementById('sendBtn');
    if (!q.value.trim()) return;

    msgs.innerHTML += `<div class="msg msg-user">${q.value}</div>`;
    btn.disabled = true;

    fetch('/chat/ask', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question: q.value, dataset: ds, model: model})
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            msgs.innerHTML += `<div class="msg msg-bot" style="color:red">⚠️ ${data.error}</div>`;
        } else {
            msgs.innerHTML += `<div class="msg msg-bot"><pre>${data.answer}</pre><div class="msg-expr">Expression: ${data.expression}</div></div>`;
        }
        msgs.scrollTop = msgs.scrollHeight;
    })
    .catch(e => {
        msgs.innerHTML += `<div class="msg msg-bot" style="color:red">Error: ${e}</div>`;
    })
    .finally(() => { btn.disabled = false; });

    q.value = '';
}
</script>
</body>
</html>

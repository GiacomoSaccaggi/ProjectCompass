

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 Page Not Found — ProjectCompass</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background-color: #060d1a;
    background-image:
      radial-gradient(circle at 50% 40%, rgba(56, 189, 248, 0.14) 0%, transparent 55%),
      linear-gradient(to right, rgba(56, 189, 248, 0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(56, 189, 248, 0.045) 1px, transparent 1px);
    background-size: 100% 100%, 64px 64px, 64px 64px;
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .error-card {
    max-width: 480px;
    width: 100%;
    background: rgba(14, 25, 47, 0.92);
    border: 1px solid rgba(56, 189, 248, 0.35);
    border-top: 3px solid #fbbf24;
    border-radius: 18px;
    padding: 36px 32px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
  }
  .code { font-family: 'JetBrains Mono', monospace; font-size: 2.5rem; font-weight: 800; color: #38bdf8; margin-bottom: 8px; }
  p { color: #cbd5e1; font-size: 1rem; margin-bottom: 24px; }
  .btn {
    display: inline-block;
    padding: 10px 22px;
    border-radius: 10px;
    background: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
    color: #ffffff;
    font-weight: 700;
    font-size: 0.9rem;
    text-decoration: none;
    border: 1px solid rgba(251, 191, 36, 0.45);
  }
  .btn:hover { color: #fbbf24; }
</style>
</head>
<body>
  <div class="error-card">
    <div class="code">404</div>
    <p>404, page not found.</p>
    <a href="/" class="btn">Back to Dashboard</a>
  </div>
</body>
</html>



<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operation Completed — ProjectCompass</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #060d1a;
      background-image:
        radial-gradient(circle at 50% 35%, rgba(56, 189, 248, 0.16) 0%, transparent 55%),
        linear-gradient(to right, rgba(56, 189, 248, 0.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.045) 1px, transparent 1px);
      background-size: 100% 100%, 64px 64px, 64px 64px;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .status-card {
      max-width: 480px;
      width: 100%;
      background: rgba(14, 25, 47, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.38);
      border-top: 3px solid #fbbf24;
      border-radius: 18px;
      padding: 36px 32px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }
    .status-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(45, 212, 191, 0.16);
      border: 2px solid #2dd4bf;
      color: #2dd4bf;
      font-size: 1.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
    h1 { font-size: 1.45rem; font-weight: 800; margin-bottom: 8px; color: #f8fafc; }
    p { font-size: 0.92rem; color: #cbd5e1; line-height: 1.55; margin-bottom: 24px; }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.18s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
      color: #ffffff;
      border: 1px solid rgba(251, 191, 36, 0.45);
    }
    .btn-primary:hover { transform: translateY(-2px); color: #fbbf24; }
    .btn-secondary {
      background: rgba(6, 13, 26, 0.8);
      color: #cbd5e1;
      border: 1px solid rgba(56, 189, 248, 0.32);
    }
    .btn-secondary:hover { border-color: #fbbf24; color: #ffffff; }
  </style>
  <script>
    setTimeout(function() { window.location.href = '/analysis'; }, 1800);
  </script>
</head>
<body>
  <div class="status-card">
    <div class="status-icon">✓</div>
    <h1>Operation Completed</h1>
    <p>Your changes have been saved to the ProjectCompass catalog. Redirecting you back to the Catalog Explorer...</p>
    <div class="actions">
      <a href="/analysis" class="btn btn-primary">Go to Analysis Catalog</a>
      <a href="/" class="btn btn-secondary">Back to Dashboard</a>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #060d1a;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.16) 0%, transparent 45%),
    radial-gradient(circle at 80% 18%, rgba(251, 191, 36, 0.12) 0%, transparent 40%),
    linear-gradient(to right, rgba(56, 189, 248, 0.045) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(56, 189, 248, 0.045) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 64px 64px, 64px 64px;
  color: #f1f5f9;
  padding: 20px;
  box-sizing: border-box;
}

/* Full-width input fields */
input[type=text], input[type=password] {
  width: 100%;
  padding: 13px 16px;
  margin: 8px 0 18px 0;
  display: inline-block;
  background-color: rgba(6, 13, 26, 0.85);
  color: #f1f5f9;
  border: 1px solid rgba(56, 189, 248, 0.32);
  border-radius: 10px;
  box-sizing: border-box;
  font-size: 0.98rem;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

input[type=text]:focus, input[type=password]:focus {
  outline: none;
  border-color: #38bdf8;
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22);
}

/* Set a style for all buttons */
button {
  background: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
  color: #ffffff;
  padding: 14px 20px;
  margin: 10px 0 4px 0;
  border: 1px solid rgba(251, 191, 36, 0.45);
  border-radius: 10px;
  cursor: pointer;
  width: 100%;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  box-shadow: 0 10px 26px rgba(2, 132, 199, 0.35);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 34px rgba(56, 189, 248, 0.45);
}

/* Extra styles for the cancel button */
.cancelbtn {
  width: auto;
  padding: 10px 18px;
  background-color: #dc2626;
}

/* Center the image and position the close button */
.imgcontainer {
  text-align: center;
  margin: 28px 0 12px 0;
  position: relative;
}

.imgcontainer svg {
  filter: drop-shadow(0 8px 24px rgba(56, 189, 248, 0.35));
}

img.avatar {
  width: 40%;
  border-radius: 50%;
}

.container {
  padding: 20px 28px 28px;
}

.container label {
  font-size: 0.88rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #cbd5e1;
}

span.psw {
  float: right;
  padding-top: 16px;
}

/* The Modal (background) */
.modal {
  display: none;
  position: fixed;
  z-index: 1;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgba(6, 13, 26, 0.75);
  padding-top: 60px;
}

/* Modal Content/Box */
.modal-content {
  background-color: rgba(14, 25, 47, 0.90);
  margin: 2% auto;
  border: 1px solid rgba(56, 189, 248, 0.32);
  border-top: 4px solid #fbbf24;
  border-radius: 18px;
  width: 100%;
  max-width: 420px;
  backdrop-filter: blur(12px);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
}

/* The Close Button (x) */
.close {
  position: absolute;
  right: 25px;
  top: 0;
  color: #cbd5e1;
  font-size: 35px;
  font-weight: bold;
}

.close:hover,
.close:focus {
  color: #fbbf24;
  cursor: pointer;
}

/* Add Zoom Animation */
.animate {
  -webkit-animation: animatezoom 0.5s ease-out;
  animation: animatezoom 0.5s ease-out;
}

@-webkit-keyframes animatezoom {
  from {-webkit-transform: scale(0.92); opacity: 0;}
  to {-webkit-transform: scale(1); opacity: 1;}
}

@keyframes animatezoom {
  from {transform: scale(0.92); opacity: 0;}
  to {transform: scale(1); opacity: 1;}
}

/* Change styles for span and cancel button on extra small screens */
@media screen and (max-width: 300px) {
  span.psw {
     display: block;
     float: none;
  }
  .cancelbtn {
     width: 100%;
  }
}
</style>
</head>
<body>


  <form class="modal-content animate" action="/login/" method="post">
    <div class="imgcontainer">
      <svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="20" fill="#F0F4F8"/>
      <circle cx="50" cy="50" r="35" fill="#FFFFFF" stroke="#3F51B5" stroke-width="4"/>
      <path d="M50 25L65 75L50 60L35 75L50 25Z" fill="#E91E63"/>
      <path d="M50 25L65 75L50 60L35 75L50 25Z" fill-opacity="0.2" stroke="#E91E63" stroke-width="2"/>
      <path d="M50 25L50 50L70 50" stroke="#3F51B5" stroke-width="3" stroke-linecap="round"/>
      <path d="M50 50L30 50L50 75" stroke="#3F51B5" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="5" fill="#3F51B5"/>
      <path d="M75 50C75 63.8071 63.8071 75 50 75C36.1929 75 25 63.8071 25 50C25 36.1929 36.1929 25 50 25" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="2 4"/>
      </svg>
    </div>

    <div class="container">
      <label for="uname"><b>User name</b></label>
      <input type="text" placeholder="Enter token name" name="uname" required>

      <label for="psw"><b>Password</b></label>
      <input type="password" placeholder="Enter token value" name="psw" required>

      <button type="submit">Login</button>
    </div>
  </form>


</body>
</html>

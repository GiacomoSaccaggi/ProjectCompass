# Docker Compose override for deploying Compass on a k0s controller host.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.k0s.yml up -d
#
# network_mode: host  → container accesses k0s API at localhost:9083
#                        and exposes Compass on the host's network directly.
#
# Volume mounts:
#   - k0s kubeconfig (read-only) → auto-detected by Compass
#   - docker.sock → allows DockerWorkerProvider to manage k0s worker containers
#   - k0s worker join token (read-only) → passed to DockerWorkerProvider
#   - projectcompass.yaml → branding, theme, connections, workers, connectors config

services:
  projectcompass:
    network_mode: host
    volumes:
      - /var/lib/k0s/pki/admin.conf:/var/lib/k0s/pki/admin.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${K0S_WORKER_TOKEN_FILE:-./data/k0s-worker.token}:/run/secrets/k0s-worker.token:ro
      - ${COMPASS_CONFIG:-./projectcompass.yaml}:/app/data/projectcompass.yaml:ro
    environment:
      - K8S_NAMESPACE=default
      - K8S_VERIFY_SSL=false
      - PC_K0S_TOKEN_FILE=/run/secrets/k0s-worker.token
      - PC_K0S_CONTROLLER_CONTAINER=${PC_K0S_CONTROLLER_CONTAINER:-}
      - PORT=8080
      - FLASK_DEBUG=False
      # Trino credentials — injected from environment
      - PRESTO_USER=${PRESTO_USER:-}
      - PRESTO_US_PSW=${PRESTO_US_PSW:-}
      - PRESTO_EU_PSW=${PRESTO_EU_PSW:-}
      - PRESTO_NP_PSW=${PRESTO_NP_PSW:-}
      - PRESTO_AP_PSW=${PRESTO_AP_PSW:-}

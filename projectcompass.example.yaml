# Optional application settings. By default, Project Compass reads
# DATA_DIR/projectcompass.yaml; PC_CONFIG_FILE can point to another path.
# Every scalar setting can be overridden with PC_<SECTION>__<KEY> variables.

branding:
  app_name: ProjectCompass
  page_title: null
  sidebar_title: Analysis
  logo_url: null
  logo_icon_url: /static/img/logo.svg
  logo_text_url: /static/img/logo_text.png
  favicon_url: /static/img/logo.svg
  backgrounds:
    data: /static/img/background1.PNG
    analysis: /static/img/background2.PNG
    upload: /static/img/upload_analysis.png
  demo_notice:
    enabled: false
    text: "DEMO Project Notice: This is a demonstration-only project intended for evaluation purposes. Although it may resemble a final product, the creators assume no liability for any errors, malfunctions, or damages resulting from its use."
  footer:
    enabled: true
    about: About ProjectCompass
    slogan: Organization Is Everything®
    copyright: Copyright ©2025 ProjectCompass. All rights reserved.

theme:
  primary_color: "#222831"
  accent_color: "#3F51B5"
  highlight_color: "#4DFFD6"
  hover_color: "#DCD2FF"
  font_family: '"Raleway", sans-serif'
  default_dark_mode: false

demo:
  enabled: false
  analyses_dir: null
  data_dir: null

features:
  ai_chat: false
  rag: false
  k8s: true
  pipeline_builder: false
  schedules: true
  executions: true
  rawgraphs: false
  query_runner: false
  db_connections: false
  todo: false

# Connection lists are YAML-only. Passwords and custom URIs can use
# ${ENV_VAR} references and are encrypted when synchronized into the database.
# Example preset (provide WAREHOUSE_PASSWORD through the process environment);
# replace `connections: []` with this list:
# - name: Warehouse
#   type: postgres
#   host: warehouse.example.com
#   port: 5432
#   database: analytics
#   username: readonly
#   password: ${WAREHOUSE_PASSWORD}
#   extra_params:
#     sslmode: require
connections: []

# Kubernetes worker provisioning settings for isolated Flow execution.
# Override via PC_WORKERS__PROVIDER, PC_WORKERS__DOCKER__IMAGE, etc.
workers:
  provider: docker  # "docker" | "external"
  auto_provision: true
  auto_cleanup: true
  docker:
    image: docker.io/k0sproject/k0s:latest
    cpus: "2"
    memory: "4g"
    network: bridge  # bridge supports multiple managed workers; host is limited to one
    auto_cleanup: true
    join_token_file: null  # or set PC_K0S_TOKEN_FILE to a mounted token file
    controller_container: null  # optional fallback for generating a token with docker exec
    ready_timeout_seconds: 120
  external:
    ensure_script: null
    release_script: null
    status_script: null

# Pipeline Builder step connectors. Built-in connectors (python_script, sql_query)
# are available by default. Add custom container-based connectors below:
# - name: trino_etl
#   description: "Run Trino ETL job"
#   image: "custom-trino-runner:latest"
#   parameters:
#     query: {type: text, required: true}
#     connection: {type: select, source: connections}
connectors:
  - name: python_script
    description: "Run custom Python script"
    builtin: true
    image: "python:3.12-slim"
    parameters:
      code:
        type: text
        required: true
  - name: sql_query
    description: "Execute SQL query against a connection"
    builtin: true
    image: "python:3.12-slim"
    parameters:
      query:
        type: text
        required: true
      connection:
        type: select
        source: connections